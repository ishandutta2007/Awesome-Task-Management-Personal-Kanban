<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Vibrant accent gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Kanban column gradients -->
    <linearGradient id="colGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="colGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="colGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: url(#primaryGrad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        fill: #f8fafc;
      }
      .col-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .card-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #cbd5e1;
      }
      .chip-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 10px;
        font-weight: 600;
      }

      /* Dynamic Animations */
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes floatCard3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @keyframes movingGradient {
        0% { transform: translateX(0px); }
        100% { transform: translateX(200px); }
      }

      .animated-card-1 {
        animation: floatCard1 4s ease-in-out infinite;
      }
      .animated-card-2 {
        animation: floatCard2 5s ease-in-out infinite;
      }
      .animated-card-3 {
        animation: floatCard3 4.5s ease-in-out infinite;
      }
      .pulse-circle {
        animation: pulseGlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" stroke-dasharray="4,8" />
    <line x1="300" y1="0" x2="300" y2="420" stroke-dasharray="4,8" />
    <line x1="500" y1="0" x2="500" y2="420" stroke-dasharray="4,8" />
    <line x1="700" y1="0" x2="700" y2="420" stroke-dasharray="4,8" />
    <line x1="900" y1="0" x2="900" y2="420" stroke-dasharray="4,8" />
    <line x1="1100" y1="0" x2="1100" y2="420" stroke-dasharray="4,8" />
    <line x1="0" y1="70" x2="1200" y2="70" stroke-dasharray="4,8" />
    <line x1="0" y1="140" x2="1200" y2="140" stroke-dasharray="4,8" />
    <line x1="0" y1="210" x2="1200" y2="210" stroke-dasharray="4,8" />
    <line x1="0" y1="280" x2="1200" y2="280" stroke-dasharray="4,8" />
    <line x1="0" y1="350" x2="1200" y2="350" stroke-dasharray="4,8" />
  </g>

  <!-- Glowing Background Orbs (Behind Title & Cards) -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" filter="url(#glow)" opacity="0.15" class="pulse-circle" />
  <circle cx="1050" cy="320" r="140" fill="#c084fc" filter="url(#glow)" opacity="0.15" class="pulse-circle" />
  <circle cx="600" cy="220" r="100" fill="#818cf8" filter="url(#glow)" opacity="0.12" class="pulse-circle" />

  <!-- DYNAMIC KANBAN BOARD PREVIEW (Rendered in lower 220px region) -->
  <g transform="translate(60, 205)">
    <!-- Column 1: Backlog / To-Do -->
    <rect x="0" y="0" width="340" height="185" rx="12" fill="url(#colGrad1)" stroke="#334155" stroke-width="1" />
    <circle cx="24" cy="24" r="5" fill="#f59e0b" />
    <text x="38" y="28" fill="#f59e0b" class="col-title">To-Do / Backlog</text>
    <rect x="290" y="14" width="32" height="20" rx="10" fill="#334155" />
    <text x="306" y="28" text-anchor="middle" class="badge-text" fill="#94a3b8">8</text>

    <!-- Card 1.1 (Animated Float) -->
    <g class="animated-card-1" transform="translate(16, 46)">
      <rect x="0" y="0" width="308" height="58" rx="8" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <rect x="12" y="12" width="60" height="16" rx="4" fill="#38bdf8" fill-opacity="0.2" />
      <text x="42" y="24" text-anchor="middle" fill="#38bdf8" class="chip-text">FEATURE</text>
      <text x="12" y="44" class="card-text">Triage incoming tickets with Taskuary AI</text>
      <circle cx="286" cy="24" r="8" fill="#475569" />
      <text x="286" y="27" text-anchor="middle" font-size="9" fill="#f1f5f9">AI</text>
    </g>

    <!-- Card 1.2 -->
    <g transform="translate(16, 114)">
      <rect x="0" y="0" width="308" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <rect x="12" y="12" width="62" height="16" rx="4" fill="#f43f5e" fill-opacity="0.2" />
      <text x="43" y="24" text-anchor="middle" fill="#f43f5e" class="chip-text">ROADMAP</text>
      <text x="12" y="43" class="card-text">Refactor sprint backlog on Plane self-host</text>
    </g>

    <!-- Column 2: In Progress -->
    <rect x="370" y="0" width="340" height="185" rx="12" fill="url(#colGrad2)" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="394" cy="24" r="5" fill="#6366f1" />
    <text x="408" y="28" fill="#818cf8" class="col-title">In Progress</text>
    <rect x="660" y="14" width="32" height="20" rx="10" fill="#4338ca" />
    <text x="676" y="28" text-anchor="middle" class="badge-text" fill="#e0e7ff">5</text>

    <!-- Card 2.1 (Animated Float) -->
    <g class="animated-card-2" transform="translate(386, 46)">
      <rect x="0" y="0" width="308" height="58" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
      <rect x="12" y="12" width="60" height="16" rx="4" fill="#a855f7" fill-opacity="0.2" />
      <text x="42" y="24" text-anchor="middle" fill="#c084fc" class="chip-text">KANBAN</text>
      <text x="12" y="44" class="card-text">Design interactive WIP limits on Planka</text>
      <!-- Progress Bar -->
      <rect x="210" y="18" width="80" height="6" rx="3" fill="#334155" />
      <rect x="210" y="18" width="56" height="6" rx="3" fill="#818cf8" />
    </g>

    <!-- Card 2.2 -->
    <g transform="translate(386, 114)">
      <rect x="0" y="0" width="308" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <rect x="12" y="12" width="46" height="16" rx="4" fill="#10b981" fill-opacity="0.2" />
      <text x="35" y="24" text-anchor="middle" fill="#34d399" class="chip-text">SYNC</text>
      <text x="12" y="43" class="card-text">CalDAV bi-directional sync with Vikunja</text>
    </g>

    <!-- Column 3: Done -->
    <rect x="740" y="0" width="340" height="185" rx="12" fill="url(#colGrad3)" stroke="#334155" stroke-width="1" />
    <circle cx="764" cy="24" r="5" fill="#10b981" />
    <text x="778" y="28" fill="#34d399" class="col-title">Done / Shipped</text>
    <rect x="1030" y="14" width="32" height="20" rx="10" fill="#334155" />
    <text x="1046" y="28" text-anchor="middle" class="badge-text" fill="#94a3b8">24</text>

    <!-- Card 3.1 (Animated Float) -->
    <g class="animated-card-3" transform="translate(756, 46)">
      <rect x="0" y="0" width="308" height="58" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="0.8" />
      <rect x="12" y="12" width="54" height="16" rx="4" fill="#10b981" fill-opacity="0.2" />
      <text x="39" y="24" text-anchor="middle" fill="#34d399" class="chip-text">&#10003; DONE</text>
      <text x="12" y="44" class="card-text">Automated terminal tasking via Taskwarrior</text>
    </g>

    <!-- Card 3.2 -->
    <g transform="translate(756, 114)">
      <rect x="0" y="0" width="308" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <rect x="12" y="12" width="62" height="16" rx="4" fill="#38bdf8" fill-opacity="0.2" />
      <text x="43" y="24" text-anchor="middle" fill="#38bdf8" class="chip-text">&#10003; DEPLOY</text>
      <text x="12" y="43" class="card-text">Docker compose container setup for OpenProject</text>
    </g>
  </g>

  <!-- FOREGROUND HEADER CONTENT (Strictly on top, crystal-clear, unobstructed) -->
  <g transform="translate(60, 52)">
    <!-- Pill tag -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#38bdf8" />
    <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="0" y="72" class="title-text">Task Management &amp; Personal Kanban</text>

    <!-- Subtitle -->
    <text x="0" y="108" class="subtitle-text">Curated SaaS Platforms, Self-Hosted Boards, CLI Runners &amp; Local-First AI Agents</text>

    <!-- Decorative Top Right Status Pill -->
    <g transform="translate(860, 8)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#22c55e" />
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">25+ Open-Source &#8226; 10 SaaS</text>
    </g>
  </g>
</svg>
